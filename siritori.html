<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >画像しりとり</title>
    <style>
        .center {
            text-align: center;
            /* 横並び Flexボックス */
            display: flex;
            /* column→Flexボックスの向きを縦（たて）にする */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .image-section img {
            width: 534px;
            height: 300px;
        }
    </style>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="center">
        <h1>画像しりとり</h1>
        <section class="image-section">
            <img src="gake.jpg" alt="がけの画像">
        </section>
        <section class="image-section">
            <img src="kemuri.jpg" alt="けむりの画像">
        </section>
        <section class="image-section">
            <img src="ribose.jpg" alt="リボースうの画像">
        </section>
        <section class="image-section">
            <img src="surume.jpg" alt="スルメの画像">
        </section>
        <section class="image-section">
            <img src="mezonikkoku.jpg" alt="めぞん一刻の画像">
        </section>
        <section class="image-section">
            <img src="kuri.jpg" alt="くりの画像">
        </section>
        

        
    </div>
</body>
</html>
